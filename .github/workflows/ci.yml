name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar (PyTorch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,exportar]"
      - name: Lint
        run: ruff check python
      - name: Testes (amostragem, GPT-2 puro, exportação ONNX, tokenização, métricas)
        run: pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes (amostragem, vetores, bytes dos tokens)
        run: node --test "web/test/*.test.js"
