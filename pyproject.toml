[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-por-dentro"
version = "0.1.0"
description = "Tokens, embeddings, atenção e probabilidades medidos num modelo de linguagem de verdade."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "torch>=2.2", "transformers>=4.45", "matplotlib>=3.8", "scipy>=1.11", "huggingface_hub>=0.24"]

[project.optional-dependencies]
exportar = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 132
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
